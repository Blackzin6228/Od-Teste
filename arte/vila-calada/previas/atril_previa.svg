<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="480" viewBox="0 0 1270 480" shape-rendering="crispEdges" font-family="sans-serif">
  <!-- Prévia do atril do campanário com o Livro do Sineiro. Desenho próprio, vistas ortográficas: 1 pixel do bloco = 16 px. -->
  <rect width="1270" height="480" fill="#0f0e12"/>
  <text x="20" y="32" font-size="20" fill="#d8d0bc">Atril do Sineiro (campanário da Vila Calada) - prévia v1 - modelo atril_sineiro.bbmodel</text>

  <!-- ===================== FRENTE (onde o jogador fica para ler) ===================== -->
  <g transform="translate(20,50)">
    <rect width="300" height="360" fill="#17161c"/>
    <rect x="0" y="320" width="300" height="40" fill="#1d1b22"/>
    <!-- base -->
    <rect x="70" y="288" width="160" height="32" fill="#3b2e25"/>
    <rect x="70" y="300" width="160" height="2" fill="#2a211c"/>
    <rect x="70" y="288" width="22" height="12" fill="#161210"/>
    <rect x="204" y="306" width="26" height="14" fill="#2a211c"/>
    <!-- poste -->
    <rect x="118" y="128" width="64" height="160" fill="#3b2e25"/>
    <rect x="134" y="128" width="2" height="160" fill="#2a211c"/>
    <rect x="162" y="128" width="2" height="160" fill="#2a211c"/>
    <rect x="150" y="180" width="3" height="42" fill="#161210"/>
    <rect x="118" y="268" width="64" height="20" fill="#2a211c"/>
    <!-- tampo inclinado: o topo aparece por causa da inclinação -->
    <rect x="38" y="62" width="224" height="73" fill="#4d3b2e"/>
    <rect x="38" y="80" width="224" height="2" fill="#3b2e25"/>
    <rect x="38" y="98" width="224" height="2" fill="#3b2e25"/>
    <rect x="38" y="116" width="224" height="2" fill="#3b2e25"/>
    <rect x="232" y="62" width="30" height="22" fill="#161210"/>
    <rect x="38" y="135" width="224" height="30" fill="#3b2e25"/>
    <rect x="38" y="150" width="30" height="15" fill="#161210"/>
    <rect x="198" y="140" width="40" height="12" fill="#2a211c"/>
    <!-- capa do livro -->
    <rect x="62" y="64" width="176" height="55" fill="#3a2a22"/>
    <rect x="62" y="119" width="176" height="7" fill="#2a1d18"/>
    <!-- borda das páginas -->
    <rect x="70" y="101" width="160" height="15" fill="#b8a982"/>
    <rect x="70" y="105" width="160" height="1" fill="#d6c8a0"/>
    <rect x="70" y="110" width="160" height="1" fill="#d6c8a0"/>
    <!-- páginas abertas -->
    <rect x="70" y="52" width="160" height="49" fill="#c9b98f"/>
    <rect x="70" y="52" width="76" height="49" fill="#d0c197"/>
    <rect x="142" y="52" width="16" height="49" fill="#9e8e66"/>
    <rect x="80" y="58" width="56" height="2" fill="#6b5a40"/>
    <rect x="80" y="64" width="48" height="2" fill="#6b5a40"/>
    <rect x="80" y="70" width="58" height="2" fill="#6b5a40"/>
    <rect x="80" y="76" width="40" height="2" fill="#6b5a40"/>
    <rect x="80" y="84" width="56" height="2" fill="#6b5a40"/>
    <rect x="80" y="90" width="30" height="2" fill="#6b5a40"/>
    <!-- desenho do sino rachado na página da direita (símbolo nosso) -->
    <g shape-rendering="auto" fill="none" stroke="#3a2c20" stroke-width="2">
      <path d="M181,82 L184,66 Q192,58 200,66 L203,82 Z"/>
      <path d="M179,83 L205,83"/>
      <path d="M192,60 L194,67 L190,72 L193,78 L191,82" stroke="#c9b98f" stroke-width="2"/>
    </g>
    <rect x="190" y="55" width="4" height="4" fill="#3a2c20"/>
    <rect x="190" y="86" width="4" height="4" fill="#3a2c20"/>
    <rect x="166" y="94" width="52" height="2" fill="#6b5a40"/>
    <!-- fita marcadora: o acento vermelho -->
    <rect x="148" y="52" width="4" height="49" fill="#8a1717"/>
    <!-- borda que segura o livro -->
    <rect x="38" y="114" width="224" height="7" fill="#57432f"/>
    <rect x="38" y="121" width="224" height="14" fill="#3b2e25"/>
    <rect x="120" y="121" width="40" height="14" fill="#2a211c"/>
    <!-- fita pendurada na frente -->
    <rect x="142" y="118" width="16" height="78" fill="#8a1717"/>
    <rect x="152" y="118" width="6" height="78" fill="#5c0e0e"/>
    <polygon points="142,197 150,188 158,197" fill="#17161c" shape-rendering="auto"/>
    <text x="10" y="22" font-size="15" fill="#c9c2b0">Frente (lado de quem lê)</text>
  </g>

  <!-- ===================== LADO ===================== -->
  <g transform="translate(330,50)">
    <rect width="300" height="360" fill="#17161c"/>
    <rect x="0" y="320" width="300" height="40" fill="#1d1b22"/>
    <rect x="70" y="288" width="160" height="32" fill="#2f241d"/>
    <rect x="70" y="300" width="160" height="2" fill="#221a15"/>
    <rect x="118" y="128" width="64" height="160" fill="#2f241d"/>
    <rect x="140" y="128" width="2" height="160" fill="#221a15"/>
    <rect x="118" y="268" width="64" height="20" fill="#221a15"/>
    <!-- tampo, livro e fita inclinados 22,5 graus (a frente fica à direita, mais baixa) -->
    <g transform="rotate(22.5,150,128)">
      <rect x="54" y="96" width="192" height="32" fill="#2f241d"/>
      <rect x="54" y="96" width="192" height="3" fill="#4d3b2e"/>
      <rect x="54" y="112" width="40" height="16" fill="#161210"/>
      <rect x="230" y="80" width="16" height="16" fill="#2f241d"/>
      <rect x="78" y="88" width="144" height="8" fill="#2a1d18"/>
      <rect x="86" y="72" width="128" height="16" fill="#b8a982"/>
      <rect x="86" y="76" width="128" height="1" fill="#d6c8a0"/>
      <rect x="86" y="82" width="128" height="1" fill="#d6c8a0"/>
      <rect x="246" y="76" width="4" height="84" fill="#8a1717"/>
    </g>
    <text x="10" y="22" font-size="15" fill="#c9c2b0">Lado (frente à direita)</text>
  </g>

  <!-- ===================== COSTAS ===================== -->
  <g transform="translate(640,50)">
    <rect width="300" height="360" fill="#17161c"/>
    <rect x="0" y="320" width="300" height="40" fill="#1d1b22"/>
    <!-- baixo do tampo (aparece pela inclinação) -->
    <rect x="38" y="91" width="224" height="74" fill="#241b16"/>
    <rect x="38" y="120" width="224" height="3" fill="#1a1411"/>
    <rect x="38" y="140" width="224" height="3" fill="#1a1411"/>
    <rect x="38" y="62" width="224" height="29" fill="#3b2e25"/>
    <rect x="38" y="62" width="224" height="3" fill="#4d3b2e"/>
    <rect x="216" y="62" width="46" height="18" fill="#161210"/>
    <rect x="118" y="128" width="64" height="160" fill="#33281f"/>
    <rect x="134" y="128" width="2" height="160" fill="#241b16"/>
    <rect x="164" y="128" width="2" height="160" fill="#241b16"/>
    <rect x="118" y="268" width="64" height="20" fill="#241b16"/>
    <rect x="70" y="288" width="160" height="32" fill="#33281f"/>
    <rect x="70" y="300" width="160" height="2" fill="#241b16"/>
    <rect x="198" y="288" width="32" height="14" fill="#161210"/>
    <text x="10" y="22" font-size="15" fill="#c9c2b0">Costas</text>
  </g>

  <!-- ===================== DETALHE DAS PÁGINAS ===================== -->
  <g transform="translate(950,50)">
    <rect width="300" height="360" fill="#17161c"/>
    <text x="10" y="22" font-size="15" fill="#c9c2b0">Páginas (1 quadrado = 1 pixel, 16x)</text>
    <!-- 10 x 8 pixels, cada um com 24 px -->
    <rect x="30" y="60" width="240" height="192" fill="#c9b98f"/>
    <rect x="30" y="60" width="120" height="192" fill="#d0c197"/>
    <rect x="126" y="60" width="48" height="192" fill="#b8a982"/>
    <rect x="138" y="60" width="24" height="192" fill="#9e8e66"/>
    <!-- linhas de texto (página esquerda) -->
    <rect x="30" y="84" width="96" height="24" fill="#8a7853"/>
    <rect x="54" y="108" width="72" height="24" fill="#8a7853"/>
    <rect x="30" y="132" width="96" height="24" fill="#8a7853"/>
    <rect x="30" y="180" width="72" height="24" fill="#8a7853"/>
    <rect x="30" y="204" width="96" height="24" fill="#8a7853"/>
    <!-- sino rachado (página direita) -->
    <rect x="198" y="84" width="24" height="24" fill="#3a2c20"/>
    <rect x="174" y="108" width="24" height="24" fill="#3a2c20"/>
    <rect x="222" y="108" width="24" height="24" fill="#3a2c20"/>
    <rect x="174" y="132" width="24" height="24" fill="#3a2c20"/>
    <rect x="222" y="132" width="24" height="24" fill="#3a2c20"/>
    <rect x="198" y="132" width="24" height="24" fill="#6b5a40"/>
    <rect x="174" y="156" width="72" height="24" fill="#3a2c20"/>
    <rect x="198" y="156" width="24" height="24" fill="#6b5a40"/>
    <rect x="198" y="180" width="24" height="24" fill="#3a2c20"/>
    <rect x="174" y="228" width="72" height="24" fill="#8a7853"/>
    <!-- fita no meio -->
    <rect x="150" y="156" width="24" height="96" fill="#8a1717"/>
    <rect x="162" y="156" width="12" height="96" fill="#5c0e0e"/>
    <g stroke="#0f0e12" stroke-width="1" opacity="0.35">
      <path d="M54,60V252M78,60V252M102,60V252M126,60V252M150,60V252M174,60V252M198,60V252M222,60V252M246,60V252"/>
      <path d="M30,84H270M30,108H270M30,132H270M30,156H270M30,180H270M30,204H270M30,228H270"/>
    </g>
    <text x="30" y="282" font-size="12" fill="#c9c2b0">O sino rachado: o "furo" no meio é a rachadura.</text>
    <text x="30" y="300" font-size="12" fill="#c9c2b0">Nada de Cruz de Sangue nem símbolo da obra.</text>
  </g>

  <!-- ===================== PALETA ===================== -->
  <g transform="translate(20,428)" font-size="13" fill="#c9c2b0">
    <text x="0" y="14">Paleta:</text>
    <rect x="60" y="2" width="16" height="16" fill="#4d3b2e"/><rect x="78" y="2" width="16" height="16" fill="#3b2e25"/><rect x="96" y="2" width="16" height="16" fill="#2a211c"/><rect x="114" y="2" width="16" height="16" fill="#161210"/>
    <text x="136" y="14">madeira queimada</text>
    <rect x="260" y="2" width="16" height="16" fill="#d6c8a0"/><rect x="278" y="2" width="16" height="16" fill="#c9b98f"/><rect x="296" y="2" width="16" height="16" fill="#b8a982"/><rect x="314" y="2" width="16" height="16" fill="#3a2c20"/>
    <text x="336" y="14">papel velho e tinta</text>
    <rect x="470" y="2" width="16" height="16" fill="#3a2a22"/><rect x="488" y="2" width="16" height="16" fill="#2a1d18"/>
    <text x="510" y="14">capa de couro</text>
    <rect x="620" y="2" width="16" height="16" fill="#8a1717"/><rect x="638" y="2" width="16" height="16" fill="#5c0e0e"/>
    <text x="660" y="14">acento: a fita vermelha</text>
    <text x="0" y="44">Um bloco (16x16x16). Tampo inclinado 22,5 graus, livro aberto em cima, borda para o livro não escorregar. Madeira carbonizada como o resto da vila.</text>
  </g>
</svg>
