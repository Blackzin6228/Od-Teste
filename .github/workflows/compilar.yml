name: Compilar

# Roda em todo Pull Request e quando algo entra no main (não roda duas vezes no mesmo PR).
# Se não compilar ou um teste falhar, fica vermelho e o PR não entra no main.
# O teste do servidor (8 min) só roda se o PR mexeu em código ou recursos do mod.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      codigo: ${{ steps.mudou.outputs.codigo }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: O PR mexeu em código?
        id: mudou
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "codigo=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          if git diff --name-only "$BASE" HEAD | grep -qE '^(src/|build\.gradle|settings\.gradle|gradle\.properties|gradle/|ferramentas/teste_servidor\.sh|ferramentas/baixar_libs\.sh|\.github/)'; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "codigo=false" >> "$GITHUB_OUTPUT"
            echo "Só documentos/arte: o teste do servidor vai pular."
          fi

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Guardar os jars do pack entre execuções
        uses: actions/cache@v4
        with:
          path: libs
          key: libs-${{ hashFiles('build.gradle') }}

      - name: Baixar os mods do pack (mesmas versões do servidor)
        run: bash ferramentas/baixar_libs.sh

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar e testar
        run: ./gradlew build --no-daemon

      - name: Guardar o jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

  servidor:
    name: Ligar servidor com o pack inteiro
    needs: compilar
    if: needs.compilar.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Pegar o jar compilado
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: jar

      - name: Guardar o servidor e os mods entre execuções
        uses: actions/cache@v4
        with:
          path: |
            servidor-teste/libraries
            servidor-teste/mods
            servidor-teste/run.sh
            servidor-teste/packwiz.json
          key: servidor-${{ github.run_id }}
          restore-keys: servidor-

      - name: Mais memória (swap de 8 GB)
        run: |
          sudo fallocate -l 8G /swapextra && sudo chmod 600 /swapextra
          sudo mkswap /swapextra && sudo swapon /swapextra && free -h

      - name: Ligar o servidor (falha se crashar)
        run: |
          JAR=$(ls jar/*.jar | grep -v -- '-sources' | head -1)
          bash ferramentas/teste_servidor.sh "$JAR" servidor-teste

      - name: Guardar os logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-servidor
          path: |
            servidor-teste/console.log
            servidor-teste/packwiz.log
            servidor-teste/logs/latest.log
            servidor-teste/crash-reports/
          if-no-files-found: ignore
